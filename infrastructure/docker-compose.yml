version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: spectre-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./modelfiles:/modelfiles:ro
    # GPU passthrough — requires NVIDIA Container Toolkit on the host
    # (native Windows: use WSL2 + Docker Desktop with GPU support enabled;
    #  this block is ignored harmlessly if no GPU runtime is present, but
    #  local models will run on CPU only — expect it to be slow).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1   # 4GB VRAM — load one model at a time

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: spectre-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    depends_on:
      - ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: spectre-open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # Point Open WebUI at LiteLLM, not Ollama directly, so all 6
      # models (2 cloud + 4 local) show up in one dropdown.
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text
      - RAG_OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - litellm

  auto-router:
    image: python:3.12-slim
    container_name: spectre-auto-router
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../scripts:/app
    command: >
      sh -c "pip install --no-cache-dir fastapi httpx uvicorn[standard] &&
             uvicorn auto_router:app --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    environment:
      - LITELLM_BASE=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    depends_on:
      - litellm

  searxng:
    image: searxng/searxng:latest
    container_name: spectre-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - searxng-data:/etc/searxng

volumes:
  ollama-data:
  open-webui-data:
  searxng-data:
