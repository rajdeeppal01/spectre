model_list:
  # ── Cloud Tier — Gemini (student plan API key) ──────────────────────
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.0-flash-exp
      api_key: os.environ/GEMINI_API_KEY

  # ── Local Tier — Ollama (localhost:11434) ───────────────────────────
  # These point at the custom-built models from pull_models.ps1
  # (base quantized model + Modelfile system prompt + hardware tuning
  # params), NOT the raw base tags — otherwise the SPECTRE/ARCHITECT/
  # etc. system prompts never get applied.
  - model_name: atlas
    litellm_params:
      model: ollama/atlas
      api_base: http://ollama:11434

  - model_name: spectre
    litellm_params:
      model: ollama/spectre
      api_base: http://ollama:11434

  - model_name: architect
    litellm_params:
      model: ollama/architect
      api_base: http://ollama:11434

  - model_name: oracle
    litellm_params:
      model: ollama/oracle
      api_base: http://ollama:11434

  # ── Embedding model for Open WebUI RAG (local, no VRAM) ─────────────
  - model_name: nomic-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

litellm_settings:
  drop_params: true
  set_verbose: false
  # SPECTRE is never allowed to fall back to a cloud model under any
  # retry/fallback logic — keep it out of general_settings fallbacks.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # No fallback chain defined for "spectre" on purpose — it must fail
  # loudly rather than silently reroute offensive-security content to
  # a cloud model.
