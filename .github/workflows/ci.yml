name: SPECTRE Autonomous AI Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-engine:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install websockets playwright pytest psutil
        python -m playwright install chromium

    - name: Compile and validate Python source files
      run: |
        python -m py_compile scripts/spectre_dashboard.py
        python -m py_compile scripts/init_rag.py
        python -m py_compile scripts/health_check.py

    - name: Launch SPECTRE Dashboard & WebSocket Server
      shell: powershell
      run: |
        $proc = Start-Process python -ArgumentList "scripts/spectre_dashboard.py --port 5050 --ws-port 5051 --no-browser" -PassThru
        Start-Sleep -Seconds 4
        # Verify socket availability
        $socket = New-Object System.Net.Sockets.TcpClient
        try {
            $socket.Connect("127.0.0.1", 5050)
            Write-Host "SPECTRE HTTP Server listening on 5050 [OK]"
            $socket.Close()
        } catch {
            Write-Error "Failed to connect to SPECTRE server on port 5050"
            exit 1
        }

    - name: Run Track B Interactive PTY Terminal Verification Suite
      run: |
        python tests/test_interactive_terminal.py

    - name: Run Option 4 Workspace File Explorer & Code Viewer Suite
      run: |
        python tests/test_workspace_files.py

    - name: Run Phases 1-4 Autonomous Agentic Capabilities Suite
      run: |
        python tests/test_agentic_capabilities.py

